<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>司機接單平台 - 台北機場送機專車</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 手機版頂部導航 -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="h-9 w-9 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
        <i class="fa-solid fa-car"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white leading-tight">台北機場專車 - 司機接單平台</h1>
        <p class="text-[11px] text-emerald-400 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 待命中 / 可即時接單
        </p>
      </div>
    </div>

    <!-- 司機身分切換 (模擬司機登入) -->
    <div class="text-right">
      <label class="block text-[10px] text-slate-400">目前駕駛身分：</label>
      <select id="driverSelect" onchange="onDriverChanged()" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-white focus:outline-none">
        <!-- JS 動態載入 -->
      </select>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 max-w-lg w-full mx-auto p-4 space-y-5 pb-16">

    <!-- 本人進行中之行程橫幅 (若有) -->
    <div id="myActiveTripSection" class="hidden">
      <div class="bg-gradient-to-br from-emerald-950/80 to-slate-900 border-2 border-emerald-500/50 rounded-2xl p-4 shadow-xl space-y-3">
        <div class="flex items-center justify-between">
          <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            ★ 您目前承接的送機行程
          </span>
          <span id="activeTripId" class="text-xs font-mono font-bold text-emerald-400"></span>
        </div>

        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2 text-xs">
          <div>
            <p class="text-[11px] text-slate-400">上車地點：</p>
            <p id="activePickup" class="text-sm font-bold text-white"></p>
            <p id="activeTime" class="text-[11px] text-amber-400 font-mono mt-0.5"></p>
          </div>
          <div class="pt-1 border-t border-slate-800 flex justify-between items-center">
            <div>
              <p class="text-[11px] text-slate-400">目的地機場：</p>
              <p id="activeAirport" class="text-xs font-bold text-sky-400"></p>
            </div>
            <div class="text-right">
              <p class="text-[11px] text-slate-400">趟次車資：</p>
              <p id="activeFare" class="text-sm font-bold text-emerald-400"></p>
            </div>
          </div>
        </div>

        <!-- 乘客聯絡資訊與直撥電話 -->
        <div class="flex items-center justify-between pt-1">
          <div>
            <p id="activeCustomerName" class="text-xs font-semibold text-slate-200"></p>
            <p id="activePaxBags" class="text-[10px] text-slate-400"></p>
          </div>
          <a id="activeCallBtn" href="#" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold text-white flex items-center space-x-1.5 shadow">
            <i class="fa-solid fa-phone"></i>
            <span>撥打給乘客</span>
          </a>
        </div>

        <!-- 狀態推進按鈕 -->
        <div id="tripActionBtns" class="grid grid-cols-2 gap-2 pt-2">
          <!-- JS 動態填入 -->
        </div>
      </div>
    </div>

    <!-- 可接單之機場行程區塊 -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-white flex items-center space-x-2">
          <i class="fa-solid fa-bell text-amber-400"></i>
          <span>可承接之機場送機行程</span>
        </h2>
        <span id="jobCountBadge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">0</span>
      </div>
      <p class="text-xs text-slate-400">來自各台北叫車群組、等待司機確認接單的送機單：</p>

      <div id="availableJobsList" class="space-y-3">
        <!-- JS 動態載入 -->
      </div>
    </div>

  </main>

  <script src="/static/driver.js"></script>
</body>
</html>
